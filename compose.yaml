# Postgres local para rodar a aplicacao fora dos testes.
# Os testes sobem o proprio container via Testcontainers.
#
#   docker compose up -d
#   ./mvnw spring-boot:run

services:
  postgres:
    image: postgres:16
    container_name: estoque-postgres
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
    ports:
      - "5432:5432"
    command:
      # Deixa visivel no log toda espera por lock acima de 200 ms. E a forma mais barata
      # de descobrir contencao em producao antes que ela vire chamado de suporte.
      - "postgres"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "deadlock_timeout=200ms"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 10
